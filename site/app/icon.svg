<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <title>Deskbeat</title>
  <!-- The Deskbeat mark. One file for both browser themes: an Ink tile on a light tab strip, a Paper tile on a dark one. -->
  <style>
    .tile { fill: #131316; }
    .ink { fill: none; stroke: #F5F4F0; stroke-linecap: round; }
    .sun { fill: #FF6B45; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #F5F4F0; }
      .ink { stroke: #131316; }
      .sun { fill: #CC3510; }
    }
  </style>
  <rect class="tile" width="108" height="108" rx="26"/>
  <path class="ink" d="M24 83H84" stroke-width="12"/>
  <path class="ink" d="M32.13 64.89 21.66 61.49 M40.48 53.39 28.73 37.21 M54 49 54 22 M67.52 53.39 80.45 35.59 M75.87 64.89 89.19 60.57" stroke-width="10"/>
  <path class="sun" d="M39 72a15 15 0 0 1 30 0z"/>
</svg>