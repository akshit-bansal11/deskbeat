<!-- The Deskbeat mark: a sun coming up off a desk, its five rays a spectrum caught mid-song. The desktop is the horizon and the music is what rises over it. For dark pages: a Paper tile, an Ink desk and rays, and the sun in the deeper Ember that holds against Paper. Flat colours, no gradient. The same numbers are in crates/core/src/mark.rs. -->
