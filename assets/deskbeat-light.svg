<?xml version="1.0" encoding="UTF-8"?>
<!-- The Deskbeat mark: four sound bars, centred like a waveform, whose heights fall away to draw the letter D. For light pages. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D3BFF"/>
      <stop offset="1" stop-color="#FF3D8B"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="26" fill="url(#tile)"/>
  <rect x="21" y="19" width="13" height="70" rx="6.5" fill="#FFFFFF"/>
  <rect x="39" y="22" width="13" height="64" rx="6.5" fill="#FFFFFF"/>
  <rect x="57" y="29" width="13" height="50" rx="6.5" fill="#FFFFFF"/>
  <rect x="75" y="41" width="13" height="26" rx="6.5" fill="#FFFFFF"/>
</svg>
